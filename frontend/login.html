<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Profile Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

    <!-- Minimal Header -->
    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container justify-content-between">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-id-card-clip"></i> ProfilePortal
            </a>
            <span class="text-muted small">
                Don't have an account? <a href="register.html" class="fw-bold">Sign Up</a>
            </span>
        </div>
    </nav>

    <!-- Auth Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-check"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to manage your digital profile</p>
            </div>

            <!-- Quick Demo Credentials Fill Pills -->
            <div class="demo-banner">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <strong><i class="fas fa-magic me-1"></i> Demo One-Click Login</strong>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="demo-pill" onclick="fillDemoUser('sarah@example.com', 'User@123')">
                        <i class="fas fa-user me-1 text-primary"></i> Sarah (User)
                    </button>
                    <button type="button" class="demo-pill" onclick="fillDemoUser('john.miller@example.com', 'User@123')">
                        <i class="fas fa-user me-1 text-primary"></i> John (User)
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username_or_email">
                        Email or Username <span class="required-star">*</span>
                    </label>
                    <div class="input-icon-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="text" id="username_or_email" class="form-control" placeholder="name@example.com or username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">
                            Password <span class="required-star">*</span>
                        </label>
                        <a href="forgot-password.html" class="small text-primary">Forgot Password?</a>
                    </div>
                    <div class="input-icon-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" data-target="password" title="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember_me">
                        <label class="form-check-label small text-muted" for="remember_me">
                            Remember me for 30 days
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
                    <i class="fas fa-sign-in-alt me-2"></i> Log In
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Are you an administrator? <a href="admin/admin-login.html" class="fw-bold">Admin Portal Login</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
