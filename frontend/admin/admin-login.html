<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - Profile Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/auth.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3">
        <div class="container justify-content-between">
            <a class="navbar-brand text-white" href="../index.html">
                <i class="fas fa-shield-halved text-primary"></i> ProfilePortal <span class="badge bg-primary ms-1 small">ADMIN CONSOLE</span>
            </a>
            <span class="text-secondary small">
                Standard user? <a href="../login.html" class="text-primary fw-bold">User Sign In</a>
            </span>
        </div>
    </nav>

    <div class="auth-wrapper" style="background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);">
        <div class="auth-card border-secondary shadow-lg">
            
            <div class="auth-header">
                <div class="auth-icon" style="background: rgba(79, 70, 229, 0.15); color: #818cf8;">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2>Admin Control Center</h2>
                <p>Authorized administrator access only</p>
            </div>

            <!-- Demo Administrator Autofill Pill -->
            <div class="demo-banner">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <strong><i class="fas fa-key me-1"></i> Demo Admin Credentials</strong>
                </div>
                <button type="button" class="demo-pill w-100 text-start py-2" onclick="fillAdminCredentials()">
                    <i class="fas fa-user-shield me-1 text-primary"></i> <strong>admin@portal.com</strong> (Admin@123)
                </button>
            </div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" for="admin_username">Admin Email / Username <span class="required-star">*</span></label>
                    <div class="input-icon-group">
                        <i class="fas fa-user-shield input-icon"></i>
                        <input type="text" id="admin_username" class="form-control" placeholder="admin@portal.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin_password">Admin Password <span class="required-star">*</span></label>
                    <div class="input-icon-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="admin_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" data-target="admin_password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mt-3">
                    <i class="fas fa-shield-alt me-2"></i> Access Admin Console
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Return to <a href="../index.html" class="fw-bold">Public Landing Page</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        initPasswordToggles();
        function fillAdminCredentials() {
            document.getElementById('admin_username').value = 'admin@portal.com';
            document.getElementById('admin_password').value = 'Admin@123';
            showToast('Credentials Filled', 'Admin demo login pre-filled.', 'info');
        }
    </script>
</body>
</html>
