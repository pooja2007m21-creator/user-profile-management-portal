<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Profile Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container justify-content-between">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-id-card-clip"></i> ProfilePortal
            </a>
            <span class="text-muted small">
                Remember your password? <a href="login.html" class="fw-bold">Log In</a>
            </span>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2>Recover Password</h2>
                <p>Enter your account email to receive your secure password reset token</p>
            </div>

            <!-- Step 1: Request Token Form -->
            <form id="forgot-password-form" class="mb-4">
                <div class="form-group">
                    <label class="form-label" for="reset_email">Registered Email Address <span class="required-star">*</span></label>
                    <div class="input-icon-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="reset_email" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fas fa-paper-plane me-2"></i> Send Reset Link
                </button>
            </form>

            <div id="reset-token-result" style="display: none;"></div>

            <!-- Step 2: Perform Reset Form -->
            <div class="mt-4 pt-3 border-top">
                <h6 class="fw-bold text-dark mb-3"><i class="fas fa-lock-open me-2 text-primary"></i> Step 2: Set New Password</h6>
                <form id="reset-password-form">
                    <div class="form-group">
                        <label class="form-label" for="reset_token">Reset Token <span class="required-star">*</span></label>
                        <input type="text" id="reset_token" class="form-control no-icon" placeholder="Paste reset token here" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new_password">New Password <span class="required-star">*</span></label>
                        <div class="input-icon-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="new_password" class="form-control" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" data-target="new_password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm_new_password">Confirm New Password <span class="required-star">*</span></label>
                        <div class="input-icon-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirm_new_password" class="form-control" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-btn" data-target="confirm_new_password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2">
                        <i class="fas fa-check me-2"></i> Update Password & Proceed to Login
                    </button>
                </form>
            </div>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Back to <a href="login.html" class="fw-bold">Login Screen</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
